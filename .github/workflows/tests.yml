name: Tests

on:
  pull_request:
  push:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[core]" pytest PyGithub google-api-python-client google-auth-oauthlib google-auth-httplib2 requests psutil winotify pypdf python-docx python-pptx jinja2 itsdangerous

      - name: Run tests
        run: python -m pytest -q -rfE tests/
